<section class="page">
  <h1 class="page-title">Filmes</h1>
  <p class="mt-3 text-gray-400">{{ conteudosFilmes.length }} {{ conteudosFilmes.length === 1 ? 'filme' : 'filmes' }} no catálogo</p>
  <div class="poster-grid mt-8">
    <a *ngFor="let conteudo of conteudosFilmes" [routerLink]="['/content', conteudo.conteudoId]" class="poster">
      <div class="poster-frame">
        <img [src]="conteudo.Poster || 'assets/img/poster-placeholder.svg'" [alt]="'Poster de ' + conteudo.Nome" loading="lazy">
      </div>
      <p class="poster-title">{{ conteudo.Nome }}</p>
      <p class="poster-rating">
        <svg class="rating-star" viewBox="0 0 20 20" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
        {{ conteudo.Rating.toFixed(1) }}
      </p>
    </a>
  </div>
</section>
