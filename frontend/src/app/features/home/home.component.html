<!-- Tonight's suggestion: one title shown large, with the other picks beside it to switch -->
<section *ngIf="featured as f" class="relative isolate overflow-hidden border-b border-gray-800">
  <!-- The poster, enlarged and blurred, lights the room behind the title -->
  <img class="absolute inset-0 -z-10 h-full w-full scale-125 object-cover opacity-40 blur-3xl" [src]="f.Poster || 'assets/img/poster-placeholder.svg'" alt="" aria-hidden="true">
  <div class="absolute inset-0 -z-10 bg-gradient-to-t from-gray-950 via-gray-950/70 to-gray-950/30" aria-hidden="true"></div>

  <div class="container grid gap-8 py-10 md:grid-cols-[auto,1fr] md:items-end md:gap-12 md:py-16">
    <a [routerLink]="['/content', f.Id]" class="mx-auto block w-44 shrink-0 overflow-hidden rounded-md shadow-2xl shadow-black/70 ring-1 ring-white/10 sm:w-52 md:mx-0 md:w-60">
      <img class="aspect-[2/3] w-full object-cover" [src]="f.Poster || 'assets/img/poster-placeholder.svg'" [alt]="'Poster de ' + f.Nome">
    </a>

    <div class="min-w-0 text-center md:text-left">
      <p class="font-medium text-butter-300">Sugestão para hoje</p>
      <h1 class="mt-2 break-words text-5xl leading-[0.95] sm:text-6xl lg:text-7xl">{{ f.Nome }}</h1>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-x-5 gap-y-1 text-gray-200 md:justify-start">
        <span class="flex items-center gap-1 font-semibold text-butter-400">
          <svg class="rating-star" viewBox="0 0 20 20" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
          {{ f.Rating?.toFixed(1) }}
        </span>
        <span *ngIf="f.Realizador">{{ f.Realizador }}</span>
        <span *ngIf="f.DataReleased">{{ f.DataReleased | date:'yyyy' }}</span>
      </div>

      <p *ngIf="f.Sinopse" class="mx-auto mt-5 max-w-prose text-lg leading-relaxed text-gray-200 md:mx-0">{{ f.Sinopse }}</p>

      <div class="mt-7 flex flex-wrap items-center justify-center gap-3 md:justify-start">
        <a [routerLink]="['/content', f.Id]" class="btn-primary px-5 py-2.5 text-base">Ver detalhes</a>
        <a [routerLink]="['/products']" class="btn-quiet px-5 py-2.5 text-base">Encomendar snacks</a>
      </div>

      <div *ngIf="randomConteudos.length > 1" class="mt-10">
        <p class="text-sm text-gray-400">Outras sugestões</p>
        <div class="mt-3 flex justify-center gap-3 md:justify-start">
          <button *ngFor="let cont of randomConteudos" type="button" (click)="selectFeatured(cont)" [attr.aria-pressed]="cont.Id === f.Id" [attr.aria-label]="'Mostrar ' + cont.Nome"
                  class="w-14 overflow-hidden rounded ring-2 transition-opacity duration-150 sm:w-16"
                  [ngClass]="cont.Id === f.Id ? 'ring-butter-400' : 'opacity-60 ring-transparent hover:opacity-100'">
            <img class="aspect-[2/3] w-full object-cover" [src]="cont.Poster || 'assets/img/poster-placeholder.svg'" alt="">
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="page" id="pagIni">
  <h2 class="section-title">Catálogo</h2>
  <p *ngIf="conteudos.length === 0" class="mt-4 text-gray-400">Ainda não há filmes nem séries no catálogo.</p>
  <div class="poster-grid mt-6">
    <a *ngFor="let conteudo of conteudos" [routerLink]="['/content', conteudo.Id]" class="poster">
      <div class="poster-frame">
        <img [src]="conteudo.Poster || 'assets/img/poster-placeholder.svg'" [alt]="'Poster de ' + conteudo.Nome" loading="lazy">
      </div>
      <p class="poster-title">{{ conteudo.Nome }}</p>
      <p class="poster-rating">
        <svg class="rating-star" viewBox="0 0 20 20" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
        {{ conteudo.Rating.toFixed(1) }}
      </p>
    </a>
  </div>
</section>
