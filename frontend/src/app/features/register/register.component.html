<section class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <!-- The logo sits on its own lit sign, as in the header -->
    <div class="overflow-hidden rounded-t-xl">
      <a [routerLink]="['/home']" class="flex justify-center bg-gray-50 px-8 py-6">
        <img class="h-14 w-auto" src="assets/img/logo.png" alt="Watch'eat, voltar à página inicial">
      </a>
      <div class="marquee-bulbs" aria-hidden="true"></div>
    </div>

    <div class="panel rounded-t-none border-t-0 p-6 sm:p-8">
      <h1 class="text-4xl leading-none">Criar conta</h1>
      <p *ngIf="errorMessage" class="mt-4 rounded-lg bg-red-900/40 px-3.5 py-2.5 text-sm font-medium text-red-200" role="alert">{{ errorMessage }}</p>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
        <div>
          <label for="Email" class="field-label">Email</label>
          <input formControlName="Email" type="email" name="Email" id="Email" class="field" placeholder="nome@exemplo.com" autocomplete="email" required>
        </div>
        <div>
          <label for="Password" class="field-label">Password</label>
          <input formControlName="Password" type="password" name="Password" id="Password" class="field" autocomplete="new-password" minlength="8" required>
          <p class="mt-1.5 text-sm text-gray-400">Pelo menos 8 caracteres.</p>
        </div>
        <div>
          <label for="confirm_password" class="field-label">Confirmar password</label>
          <input formControlName="confirm_password" type="password" name="confirm_password" id="confirm_password" class="field" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary w-full py-2.5 text-base">Criar conta</button>
        <p class="text-sm text-gray-400">
          Já tens conta? <a [routerLink]="['/login']" class="font-semibold text-gray-50 underline decoration-red-500 underline-offset-4 hover:decoration-2">Entrar</a>
        </p>
      </form>
    </div>
  </div>
</section>
