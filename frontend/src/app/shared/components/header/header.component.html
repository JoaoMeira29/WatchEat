<header class="sticky top-0 z-40">
  <!-- The header is the lit sign over the cinema door: a warm white board, with the row of bulbs under it -->
  <nav class="bg-gray-50 text-gray-950" aria-label="Navegação principal">
    <div class="container flex h-16 items-center gap-4">
      <button (click)="toggleMenuMobile()" type="button" class="-ml-2 rounded-lg p-2 text-gray-700 hover:bg-gray-200 md:hidden" aria-controls="mobile-menu" [attr.aria-expanded]="isOpenMobile">
        <span class="sr-only">Abrir menu</span>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>

      <a [routerLink]="['/home']" class="shrink-0 rounded">
        <img class="h-9 w-auto" src="assets/img/logo.png" alt="Watch'eat">
      </a>

      <div class="hidden items-center gap-1 md:flex">
        <a [routerLink]="['/home']" routerLinkActive="bg-gray-950 text-gray-50 hover:bg-gray-950" class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">Página inicial</a>
        <a [routerLink]="['/movies']" routerLinkActive="bg-gray-950 text-gray-50 hover:bg-gray-950" class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">Filmes</a>
        <a [routerLink]="['/series']" routerLinkActive="bg-gray-950 text-gray-50 hover:bg-gray-950" class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">Séries</a>
        <a [routerLink]="['/products']" routerLinkActive="bg-gray-950 text-gray-50 hover:bg-gray-950" class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">Produtos</a>
      </div>

      <form class="relative ml-auto hidden w-full max-w-xs lg:block" role="search">
        <label for="default-search" class="sr-only">Procurar filmes e séries</label>
        <input type="search" id="default-search" class="block w-full rounded-lg border border-gray-300 bg-white py-2 pl-3.5 pr-10 text-sm text-gray-950 placeholder-gray-500 hover:border-gray-400 focus:border-gray-950 focus:outline-none" placeholder="Procurar filmes e séries">
        <button type="submit" class="absolute inset-y-0 right-0 flex items-center rounded-r-lg px-3 text-gray-600 hover:text-gray-950">
          <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span class="sr-only">Procurar</span>
        </button>
      </form>

      <div class="ml-auto flex items-center lg:ml-0">
        <a *ngIf="!isUserLogged" [routerLink]="['/login']" class="btn-primary">Entrar</a>

        <div *ngIf="isUserLogged" class="relative">
          <button #toggleButton (click)="toggleMenu($event)" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-950 text-gray-50 hover:bg-gray-800" id="user-menu-button" aria-haspopup="true" [attr.aria-expanded]="isOpen">
            <span class="sr-only">Abrir menu da conta</span>
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2.25c-4.14 0-7.5 2.35-7.5 5.25 0 .41.34.75.75.75h13.5c.41 0 .75-.34.75-.75 0-2.9-3.36-5.25-7.5-5.25z"/></svg>
          </button>
          <div *ngIf="isOpen" class="absolute right-0 mt-3 w-56 origin-top-right overflow-hidden rounded-xl border border-gray-700 bg-gray-900 py-1.5 text-gray-50 shadow-2xl shadow-black/60" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
            <a [routerLink]="['/profile', currentUser.Id]" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-0">Perfil</a>
            <a [routerLink]="['/library']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-1">Watch'List</a>
            <a [routerLink]="['/friends']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-4">Amigos</a>
            <a [routerLink]="['/orders']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-5">Histórico de pedidos</a>
            <a [routerLink]="['/payments']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-6">Pagamentos</a>
            <a *ngIf="currentUser.Utilizador_Roles == 'Admin' || currentUser.Utilizador_Roles == 'Premium'" [routerLink]="['/statistics']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-3">Estatísticas</a>
            <a *ngIf="currentUser.Utilizador_Roles == 'Admin'" [routerLink]="['/add-content']" class="block px-4 py-2 text-sm hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-7">Adicionar conteúdo</a>
            <a *ngIf="currentUser.Utilizador_Roles == 'Normal'" [routerLink]="['/premium']" class="block px-4 py-2 text-sm font-semibold text-butter-400 hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-2">Aderir ao Premium</a>
            <div class="my-1.5 border-t border-gray-800"></div>
            <button type="button" (click)="LogoutUser()" class="block w-full px-4 py-2 text-left text-sm text-gray-300 hover:bg-gray-800" role="menuitem" tabindex="-1" id="user-menu-item-8">Sair</button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="isOpenMobile" class="border-t border-gray-200 md:hidden" id="mobile-menu">
      <div class="container space-y-1 py-3">
        <a [routerLink]="['/home']" routerLinkActive="bg-gray-950 text-gray-50" class="block rounded-lg px-3 py-2 font-semibold text-gray-700">Página inicial</a>
        <a [routerLink]="['/movies']" routerLinkActive="bg-gray-950 text-gray-50" class="block rounded-lg px-3 py-2 font-semibold text-gray-700">Filmes</a>
        <a [routerLink]="['/series']" routerLinkActive="bg-gray-950 text-gray-50" class="block rounded-lg px-3 py-2 font-semibold text-gray-700">Séries</a>
        <a [routerLink]="['/products']" routerLinkActive="bg-gray-950 text-gray-50" class="block rounded-lg px-3 py-2 font-semibold text-gray-700">Produtos</a>
      </div>
    </div>
  </nav>
  <div class="marquee-bulbs" aria-hidden="true"></div>
</header>
